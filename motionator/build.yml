name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      # Builds the C++ module for Python 3.13 (the Python inside Blender 5.2) on Windows x64,
      # then runs the correctness tests against the freshly built wheel.
      - name: Build C++ module and run tests
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-win_amd64"
          CIBW_TEST_REQUIRES: "numpy"
          CIBW_TEST_COMMAND: "python {project}/tests/test_core.py"

      - name: Package Blender extension
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: motionator-blender-extension
          path: dist/*.zip
